plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

// Target versions can be overridden per build, e.g.
//   gradle build -Pmc=26.2 -Pfapi=0.161.0+26.2
// Omitting the properties builds for the defaults in gradle.properties.
def mcVersion = (findProperty('mc') ?: project.minecraft_version).toString()
def fapiVersion = (findProperty('fapi') ?: project.fabric_api_version).toString()
def javaRelease = (findProperty('jrelease') ?: '25').toString()

// Sources and resources that differ between Minecraft API generations live in
// overlay directories: src/mc263 for 26.3, src/mc262 for 26.1/26.2.
def flavor = mcVersion == '26.3' ? 'mc263' : 'mc262'
sourceSets.main.java.srcDir("src/${flavor}/java")
sourceSets.main.resources.srcDir("src/${flavor}/resources")

// The Baritone release built for each Minecraft version.
def baritoneVersion = [
    '26.1.2': '1.18.0',
    '26.2'  : '1.19.0',
    '26.3'  : '1.20.0',
][mcVersion] ?: '1.20.0'

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

// Name every archive with the mod version and the Minecraft version it
// targets, e.g. oresim-by-krwawiec-1.3.0-mc26.1.2.jar

tasks.withType(AbstractArchiveTask).configureEach {
    archiveVersion = "${project.mod_version}-mc${mcVersion}"
}

repositories {
    mavenCentral()
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${mcVersion}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API (client commands, key bindings, render + lifecycle events)
    implementation "net.fabricmc.fabric-api:fabric-api:${fapiVersion}"

    // Optional Baritone integration (/oresim mine); not bundled, users install Baritone themselves.
    // Official cabaletta/baritone releases, one per Minecraft version (see libs/README.md).
    compileOnly files("libs/baritone-api-fabric-${baritoneVersion}.jar")
}

// ---------------------------------------------------------------------------
// Accuracy tester (development only, never part of the mod jar): generates a
// world on a dedicated server and compares OreSim's predictions with it.
//   gradlew runAccuracyTest -Pseed=12345 [-Pradius=8] [-Pdimensions=overworld,nether]
// The report is written to run-tester/oresim-accuracy-mc<version>-<seed>.md.
// ---------------------------------------------------------------------------
sourceSets {
    tester {
        compileClasspath += main.compileClasspath + main.output
        runtimeClasspath += main.runtimeClasspath + main.output
        // The tester's accessor mixins are only needed (and only exist) on 26.1/26.2.
        resources.srcDir("src/${flavor}/tester-resources")
    }
}

def testSeed = (findProperty('seed') ?: '12345').toString()

loom {
    runs {
        accuracyTest {
            server()
            name "OreSim accuracy test"
            source sourceSets.tester
            runDir "run-tester"
            ideConfigGenerated false
            programArg "--nogui"
            // The main mod is client-only, so the loader skips it on a server;
            // its classes (the simulation) must still be reachable by the tester.
            vmArg "-Dfabric.debug.disableClassPathIsolation=true"
            vmArg "-Doresim.test.mc=${mcVersion}"
            vmArg "-Doresim.test.radius=${findProperty('radius') ?: 8}"
            vmArg "-Doresim.test.dimensions=${findProperty('dimensions') ?: 'overworld,nether'}"
        }
        // Starts the real client, joins run/saves/<world> with the overlay on, logs
        // the predicted ore counts and quits:  gradlew runClientSmokeTest -Pworld=<name>
        clientSmokeTest {
            client()
            name "OreSim client smoke test"
            ideConfigGenerated false
            vmArg "-Doresim.smokeTest=true"
            programArgs "--quickPlaySingleplayer", (findProperty('world') ?: 'smoketest').toString()
        }
    }
}

tasks.matching { it.name == 'runAccuracyTest' }.configureEach {
    doFirst {
        // One world per Minecraft version and seed, so a rerun loads instead of regenerating.
        def dir = file("run-tester")
        dir.mkdirs()
        new File(dir, "eula.txt").text = "eula=true\n"
        new File(dir, "server.properties").text = """\
level-seed=${testSeed}
level-name=world-mc${mcVersion}-${testSeed}
server-port=25599
online-mode=false
"""
    }
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft", mcVersion
    inputs.property "java", javaRelease

    filesMatching("fabric.mod.json") {
        expand "version": project.version, "minecraft": mcVersion, "java": javaRelease
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = Integer.parseInt(javaRelease)
    it.options.encoding = "UTF-8"
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.toVersion(javaRelease)
    targetCompatibility = JavaVersion.toVersion(javaRelease)
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}
